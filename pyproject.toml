[project]
name = "stitchcheck"
version = "0.1.0"
description = "Phone-based stitch inspection with Muse Spark, SAM 3.1 and a fine-tuned classifier"
requires-python = ">=3.11"
dependencies = [
    "pillow==13.0.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
data = ["kagglehub==1.0.3"]
api = ["openai==3.39.0", "requests==2.34.2", "meta-sam-parser==0.1.0", "python-dotenv==1.2.4"]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
